name: Visual audit IBM redesign

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/visual-audit-redesign.yml
      - desktop/renderer/**
      - website/**
      - scripts/build-site.mjs

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download guarded redesign preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: e2b9afd876a9520dbfb181ad102e44112cf1e8bc
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs?branch=agent%2Fibm-interface-redesign&event=push&per_page=50" \
              --jq ".workflow_runs[] | select(.name == \"Apply IBM interface redesign\" and .head_sha == \"$SOURCE_HEAD\" and .conclusion == \"success\") | .id" \
              | head -n 1
          )"
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ibm-interface-redesign-preview --dir "$RUNNER_TEMP/preview"
          test -f "$RUNNER_TEMP/preview/renderer/index.html"
          test -f "$RUNNER_TEMP/preview/site/index.html"
          printf 'source_run=%s\n' "$run_id" > "$RUNNER_TEMP/preview/source-run.txt"

      - name: Serve production interfaces
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --directory "$RUNNER_TEMP/preview/site" > "$RUNNER_TEMP/site-server.log" 2>&1 &
          nohup python3 -m http.server 4174 --directory "$RUNNER_TEMP/preview/renderer" > "$RUNNER_TEMP/app-server.log" 2>&1 &
          for url in http://127.0.0.1:4173/ http://127.0.0.1:4174/; do
            for attempt in $(seq 1 30); do
              curl --fail --silent "$url" >/dev/null && break
              sleep 1
            done
            curl --fail --silent "$url" >/dev/null
          done

      - name: Audit responsive layout and interaction
        env:
          BROWSER: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$BROWSER" ]]; then
            BROWSER="$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
            export BROWSER
          fi
          test -x "$BROWSER"
          mkdir -p "$RUNNER_TEMP/browser-audit"
          cat > "$RUNNER_TEMP/browser-audit.mjs" <<'NODE'
          import { spawn } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const output = process.env.RUNNER_TEMP + '/browser-audit';
          await mkdir(output, { recursive: true });
          const results = [];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          class Client {
            constructor(socket) {
              this.socket = socket;
              this.nextId = 1;
              this.pending = new Map();
              this.errors = [];
              socket.addEventListener('message', (event) => {
                const message = JSON.parse(event.data);
                if (message.id) {
                  const request = this.pending.get(message.id);
                  if (!request) return;
                  this.pending.delete(message.id);
                  if (message.error) request.reject(new Error(JSON.stringify(message.error)));
                  else request.resolve(message.result);
                  return;
                }
                if (message.method === 'Runtime.exceptionThrown') this.errors.push(message.params.exceptionDetails?.text ?? 'Runtime exception');
                if (message.method === 'Log.entryAdded' && message.params.entry?.level === 'error') this.errors.push(message.params.entry.text);
              });
            }
            send(method, params = {}) {
              const id = this.nextId++;
              this.socket.send(JSON.stringify({ id, method, params }));
              return new Promise((resolve, reject) => this.pending.set(id, { resolve, reject }));
            }
            async value(expression) {
              const result = await this.send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.text ?? 'Evaluation failed');
              return result.result.value;
            }
          }

          async function launch(url, width, height, port) {
            const browser = spawn(process.env.BROWSER, [
              '--headless=new', '--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage',
              '--disable-background-networking', '--disable-default-apps', '--no-first-run',
              `--remote-debugging-port=${port}`, `--user-data-dir=${process.env.RUNNER_TEMP}/chrome-${port}`,
              `--window-size=${width},${height}`, url,
            ], { stdio: ['ignore', 'ignore', 'ignore'] });
            let target;
            for (let attempt = 0; attempt < 80; attempt += 1) {
              try {
                const list = await fetch(`http://127.0.0.1:${port}/json/list`).then((response) => response.json());
                target = list.find((item) => item.type === 'page');
                if (target) break;
              } catch {}
              await sleep(125);
            }
            if (!target) throw new Error(`Chrome target did not start for ${url}`);
            const socket = new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((resolve, reject) => {
              socket.addEventListener('open', resolve, { once: true });
              socket.addEventListener('error', reject, { once: true });
            });
            const client = new Client(socket);
            await client.send('Page.enable');
            await client.send('Runtime.enable');
            await client.send('Log.enable');
            await client.send('Emulation.setDeviceMetricsOverride', { width, height, deviceScaleFactor: 1, mobile: width < 600 });
            await client.send('Page.reload', { ignoreCache: true });
            await sleep(1500);
            return { browser, client, socket };
          }

          async function screenshot(client, name, fullPage = false) {
            let clip;
            if (fullPage) {
              const metrics = await client.send('Page.getLayoutMetrics');
              const width = Math.ceil(metrics.cssContentSize?.width ?? metrics.contentSize.width);
              const height = Math.min(12000, Math.ceil(metrics.cssContentSize?.height ?? metrics.contentSize.height));
              clip = { x: 0, y: 0, width, height, scale: 1 };
            }
            const capture = await client.send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: fullPage, ...(clip ? { clip } : {}) });
            await writeFile(path.join(output, `${name}.png`), Buffer.from(capture.data, 'base64'));
          }

          async function auditSite(width, height, label, port) {
            const runtime = await launch('http://127.0.0.1:4173/', width, height, port);
            try {
              const data = await runtime.client.value(`(() => ({
                title: document.title,
                heading: document.querySelector('h1')?.textContent?.trim(),
                overflow: document.documentElement.scrollWidth > window.innerWidth,
                sections: document.querySelectorAll('main section').length,
                plex: document.fonts.check('16px "IBM Plex Sans"'),
                text: document.body.innerText,
              }))()`);
              if (!data.title.includes('Subscription Proxy Inator') || !data.heading) throw new Error(`Missing site identity at ${label}`);
              if (data.overflow) throw new Error(`Horizontal site overflow at ${label}`);
              if (data.sections < 5 || !data.plex) throw new Error(`Incomplete site render at ${label}`);
              for (const prohibited of ['1,284', '99.4%', '$18.42', 'Good afternoon', 'Automatic failover in 84 ms']) {
                if (data.text.includes(prohibited)) throw new Error(`Fabricated site content found: ${prohibited}`);
              }
              await screenshot(runtime.client, `site-${label}`, true);
              results.push({ surface: 'site', label, width, height, heading: data.heading, sections: data.sections, overflow: false, plex: true });
              if (runtime.client.errors.length) throw new Error(`Site console errors at ${label}: ${runtime.client.errors.join('; ')}`);
            } finally {
              runtime.socket.close();
              runtime.browser.kill('SIGKILL');
            }
          }

          async function auditApp(width, height, label, port) {
            const runtime = await launch('http://127.0.0.1:4174/', width, height, port);
            try {
              for (let attempt = 0; attempt < 40; attempt += 1) {
                if (await runtime.client.value(`Boolean(document.querySelector('.nav-item') && document.querySelector('.page-header h1'))`)) break;
                await sleep(125);
              }
              const pages = await runtime.client.value(`[...document.querySelectorAll('.nav-item')].map((button) => button.textContent.trim())`);
              if (pages.length !== 7) throw new Error(`Expected seven desktop sections at ${label}, received ${pages.length}`);
              const visited = [];
              for (let index = 0; index < pages.length; index += 1) {
                await runtime.client.value(`document.querySelectorAll('.nav-item')[${index}].click()`);
                await sleep(250);
                const state = await runtime.client.value(`(() => {
                  const visibleTextNodes = [...document.querySelectorAll('.content-frame *')].filter((node) => {
                    const style = getComputedStyle(node);
                    return node.childNodes.length === 1 && node.firstChild?.nodeType === Node.TEXT_NODE && node.textContent.trim() && style.display !== 'none' && style.visibility !== 'hidden';
                  });
                  const minText = Math.min(...visibleTextNodes.map((node) => Number.parseFloat(getComputedStyle(node).fontSize)).filter(Number.isFinite));
                  const controls = [...document.querySelectorAll('.content-frame input, .content-frame select, .content-frame textarea, .content-frame .primary-button, .content-frame .secondary-button')];
                  const shortControls = controls.filter((node) => node.getBoundingClientRect().height < 39);
                  return {
                    title: document.querySelector('.page-header h1')?.textContent?.trim(),
                    overflow: document.documentElement.scrollWidth > window.innerWidth,
                    minText,
                    shortControls: shortControls.length,
                  };
                })()`);
                if (!state.title || state.overflow || state.minText < 12 || state.shortControls) {
                  throw new Error(`Desktop layout contract failed at ${label}/${pages[index]}: ${JSON.stringify(state)}`);
                }
                visited.push(state.title);
                if ((label === 'wide' && ['Overview', 'Providers', 'Routing', 'Usage'].includes(pages[index])) || (index === 0 && label !== 'wide')) {
                  await screenshot(runtime.client, `app-${label}-${pages[index].toLowerCase().replaceAll(/[^a-z0-9]+/g, '-')}`);
                }
              }
              results.push({ surface: 'app', label, width, height, sections: visited, overflow: false });
              if (runtime.client.errors.length) throw new Error(`App console errors at ${label}: ${runtime.client.errors.join('; ')}`);
            } finally {
              runtime.socket.close();
              runtime.browser.kill('SIGKILL');
            }
          }

          let port = 9300;
          for (const [width, height, label] of [[1440, 900, 'wide'], [1040, 800, 'medium'], [800, 760, 'tablet'], [620, 760, 'compact']]) {
            await auditApp(width, height, label, port++);
          }
          for (const [width, height, label] of [[1440, 1000, 'wide'], [840, 900, 'tablet'], [390, 844, 'mobile']]) {
            await auditSite(width, height, label, port++);
          }

          await writeFile(path.join(output, 'audit.json'), `${JSON.stringify(results, null, 2)}\n`);
          NODE
          node "$RUNNER_TEMP/browser-audit.mjs"

      - name: Upload browser audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: ibm-interface-browser-audit
          path: ${{ runner.temp }}/browser-audit
          if-no-files-found: error
          retention-days: 7
