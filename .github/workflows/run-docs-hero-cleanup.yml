name: Run documentation and hero cleanup

on:
  push:
    branches:
      - agent/remove-obsolete-docs-clean-hero
    paths:
      - .github/workflows/run-docs-hero-cleanup.yml
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/run-docs-hero-cleanup.yml

permissions:
  contents: write

concurrency:
  group: run-docs-hero-cleanup
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'agent/remove-obsolete-docs-clean-hero' || github.head_ref == 'agent/remove-obsolete-docs-clean-hero'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply the reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-docs-hero-cleanup.yml').read_text(encoding='utf-8')
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-cleanup.py').write_text(script, encoding='utf-8')
          PY
          touch docs/MIGRATION_V1.md docs/WRITING_STANDARD.md
          python3 /tmp/apply-cleanup.py

      - name: Install exact dependencies
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Verify, test, and build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build unpacked Electron application
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Commit the clean source change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist release coverage website-dist
          rm -f package-lock.local-validation.json
          rm -f .github/workflows/apply-docs-hero-cleanup.yml
          rm -f .github/workflows/run-docs-hero-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only origin/master | wc -l | tr -d ' ')" = 5
          git commit -m 'Simplify the homepage hero'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
