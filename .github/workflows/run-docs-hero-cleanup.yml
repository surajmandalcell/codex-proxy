name: Run documentation and hero cleanup

on:
  push:
    branches:
      - agent/remove-obsolete-docs-clean-hero
    paths:
      - .github/workflows/run-docs-hero-cleanup.yml
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/run-docs-hero-cleanup.yml

permissions:
  contents: write

concurrency:
  group: run-docs-hero-cleanup
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'agent/remove-obsolete-docs-clean-hero' || github.head_ref == 'agent/remove-obsolete-docs-clean-hero'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply the source change
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.cleanup/apply.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace("replacement = '''test('the hero uses one concise message", "replacement = r'''test('the hero uses one concise message", 1)
          source = source.replace('source, count = pattern.subn(replacement, source, count=1)', 'source, count = pattern.subn(lambda _match: replacement, source, count=1)', 1)
          path.write_text(source, encoding='utf-8')
          PY
          if ! python3 .cleanup/apply.py >.cleanup/OUTPUT 2>.cleanup/ERROR; then
            cat .cleanup/ERROR >&2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .cleanup/ERROR .cleanup/OUTPUT
            git commit -m 'Record cleanup assertion failure'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match for {old!r}, got {count}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'CHANGELOG.md',
              '- Removed the Version 1 migration page.\n- Removed the public writing-profile page. The automated ASD-STE100 gate remains active.',
              '- Removed two obsolete documentation pages.\n- Kept the automated ASD-STE100 gate active.',
          )
          replace_once(
              'tests/repository/design-system.test.js',
              '  assert.match(html, /Windows, macOS, and Linux/);',
              '  assert.match(html, /One local API for Claude, Codex, and Z\\.ai\\./);\n  assert.doesNotMatch(html, /hero-label|hero-assurance/);',
          )
          replace_once(
              'tests/repository/interface-completion.test.js',
              '  assert.match(docs, /system diagram shows sources, Proxy-Inator, and clients/);',
              '  assert.match(docs, /diagram shows Claude, Codex, and Z\\.ai as example sources/);',
          )
          PY

      - name: Install exact dependencies
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Verify, test, and build
        shell: bash
        run: |
          set -euo pipefail
          if ! npm run build >.cleanup/BUILD_LOG 2>&1; then
            tail -n 240 .cleanup/BUILD_LOG >&2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .cleanup/BUILD_LOG
            git commit -m 'Record cleanup build failure'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
            exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build unpacked Electron application
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Commit the clean source change
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cleanup node_modules dist release coverage website-dist
          rm -f package-lock.local-validation.json
          rm -f .github/workflows/apply-docs-hero-cleanup.yml
          rm -f .github/workflows/run-docs-hero-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only origin/master | wc -l | tr -d ' ')" = 6
          git commit -m 'Simplify the homepage hero'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
