name: Finalize web icon fallbacks

on:
  push:
    branches:
      - agent/finish-hero-icon-motion
    paths:
      - .github/workflows/finalize-web-icon-fallbacks.yml

permissions:
  contents: write

concurrency:
  group: finalize-web-icon-fallbacks
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/finish-hero-icon-motion
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install icon renderer and exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Generate web icon fallbacks and apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          rsvg-convert -w 180 -h 180 website/assets/icon.svg > website/assets/apple-touch-icon.png
          rsvg-convert -w 192 -h 192 website/assets/icon.svg > website/assets/icon-192.png
          rsvg-convert -w 512 -h 512 website/assets/icon.svg > website/assets/icon-512.png
          file website/assets/apple-touch-icon.png | grep -q '180 x 180'
          file website/assets/icon-192.png | grep -q '192 x 192'
          file website/assets/icon-512.png | grep -q '512 x 512'

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          root_index = Path('index.html')
          text = root_index.read_text(encoding='utf-8')
          text, count = re.subn(
              r'<link rel="icon" href="data:image/svg\+xml,[^"]+" />',
              '<link rel="icon" href="/desktop/renderer/assets/icon.svg" type="image/svg+xml" />',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'index.html: inline favicon replacement count {count}')
          root_index.write_text(text, encoding='utf-8')

          replace_once(
              'website/index.html',
              '<link rel="apple-touch-icon" href="assets/icon.svg">',
              '<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">',
          )
          replace_once(
              'website/index.html',
              '<div class="hero-actions" aria-label="Get started">',
              '<div class="hero-actions" role="group" aria-label="Get started">',
          )

          css = Path('website/assets/polish.css')
          text = css.read_text(encoding='utf-8')
          text, count = re.subn(
              r'\n\[data-reveal\]:nth-of-type\(2\) \{\n  transition-delay: 40ms;\n\}\n',
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'polish.css: reveal delay removal count {count}')
          css.write_text(text, encoding='utf-8')

          replace_once(
              'website/assets/site.js',
              "const revealNodes = [...document.querySelectorAll('[data-reveal]')];\nfor (const node of revealNodes) node.classList.add('reveal');",
              "const revealNodes = [...document.querySelectorAll('[data-reveal]')];\nfor (const [index, node] of revealNodes.entries()) {\n  node.classList.add('reveal');\n  node.style.transitionDelay = `${Math.min(index * 40, 200)}ms`;\n}",
          )

          manifest_path = Path('website/manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['icons'] = [
              {'src': 'assets/icon.svg', 'sizes': 'any', 'type': 'image/svg+xml', 'purpose': 'any'},
              {'src': 'assets/icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any'},
              {'src': 'assets/icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any'},
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/repository/interface-completion.test.js')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              "  const readme = await text('README.md');\n",
              "  const readme = await text('README.md');\n  const rendererDocument = await text('index.html');\n",
              1,
          )
          text = text.replace(
              "  assert.equal(manifest.icons.length, 1);\n  assert.equal(manifest.icons[0].src, 'assets/icon.svg');\n",
              "  assert.deepEqual(manifest.icons.map((icon) => icon.src), [\n"
              "    'assets/icon.svg',\n"
              "    'assets/icon-192.png',\n"
              "    'assets/icon-512.png',\n"
              "  ]);\n"
              "  assert.equal(manifest.icons[0].purpose, 'any');\n"
              "  assert.match(rendererDocument, /href=\"\\/desktop\\/renderer\\/assets\\/icon\\.svg\"/);\n",
              1,
          )
          text = text.replace(
              "  assert.equal(await exists('website/assets/icon-512.png'), false);\n  assert.equal(await exists('website/assets/social-card.png'), false);\n",
              "  for (const [asset, size] of [\n"
              "    ['website/assets/apple-touch-icon.png', 180],\n"
              "    ['website/assets/icon-192.png', 192],\n"
              "    ['website/assets/icon-512.png', 512],\n"
              "  ]) {\n"
              "    const png = await readFile(path.join(root, asset));\n"
              "    assert.deepEqual([...png.subarray(0, 8)], [137, 80, 78, 71, 13, 10, 26, 10]);\n"
              "    assert.equal(png.readUInt32BE(16), size);\n"
              "    assert.equal(png.readUInt32BE(20), size);\n"
              "  }\n"
              "  assert.equal(await exists('website/assets/social-card.png'), false);\n",
              1,
          )
          if "apple-touch-icon.png', 180" not in text or 'rendererDocument' not in text:
              raise SystemExit('interface completion test was not fully updated')
          test_path.write_text(text, encoding='utf-8')

          docs_path = Path('docs/DESIGN_SYSTEM.md')
          text = docs_path.read_text(encoding='utf-8')
          old = (
              '- `build/icon.png` is a deterministic 1024×1024 render of the canonical SVG for the pinned macOS and Windows package converter. It is not an independent design source.\n'
          )
          new = old + (
              '- `website/assets/apple-touch-icon.png`, `website/assets/icon-192.png`, and `website/assets/icon-512.png` are deterministic web compatibility renders of the same SVG. They are not independent design sources.\n'
              '- The manifest uses the SVG and explicit 192×192 and 512×512 PNG fallbacks with `purpose: any`; the edge-positioned refresh badge is not advertised as maskable.\n'
          )
          if old not in text:
              raise SystemExit('design-system package icon paragraph not found')
          docs_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          text = changelog_path.read_text(encoding='utf-8')
          marker = '- Replaced every active product mark with one canonical rounded calendar-and-refresh SVG used by the website, renderer, manifest, README, social preview, and all Electron packaging targets.\n'
          addition = marker + '- Added deterministic Apple touch, 192 px, and 512 px PNG fallbacks from the same canonical SVG for package and web-install compatibility.\n'
          if marker not in text:
              raise SystemExit('changelog icon entry not found')
          changelog_path.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          followup_path = Path('tests/repository/interface-followup.test.js')
          text = followup_path.read_text(encoding='utf-8')
          marker = "    '.github/workflows/finalize-icon-packaging.yml',\n"
          addition = marker + "    '.github/workflows/finalize-web-icon-fallbacks.yml',\n"
          if marker not in text:
              raise SystemExit('temporary workflow marker not found')
          if 'finalize-web-icon-fallbacks.yml' not in text:
              text = text.replace(marker, addition, 1)
          followup_path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-use workflow
        run: rm -f .github/workflows/finalize-web-icon-fallbacks.yml
      - name: Verify, test, build, and audit
        run: |
          npm run build
          npm audit --omit=dev --audit-level=high
          npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Commit clean review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete web icon and accessibility fallbacks"
          git push origin HEAD:agent/finish-hero-icon-motion
