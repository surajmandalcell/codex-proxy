name: Finalize version 2.1.1

on:
  push:
    branches:
      - agent/release-2.1.1-ste
    paths:
      - .release-v2.1.1/TRIGGER

permissions:
  contents: write

concurrency:
  group: finalize-version-2.1.1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-2.1.1-ste
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply the reviewed release files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .release-v2.1.1/patch.b64 > "$RUNNER_TEMP/release-2.1.1-patch.tar.xz"
          echo '09d611e60bdbaefc1f071d74fd6548824b169d0641b011041da84bc2548f94e3  '"$RUNNER_TEMP/release-2.1.1-patch.tar.xz" | sha256sum -c -
          test "$(tar -tJf "$RUNNER_TEMP/release-2.1.1-patch.tar.xz" | wc -l | tr -d ' ')" = 8
          tar -xJf "$RUNNER_TEMP/release-2.1.1-patch.tar.xz"
          test "$(node -p "require('./package.json').version")" = 2.1.1

      - name: Generate the exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test "$(node -p "require('./package-lock.json').version")" = 2.1.1
          test "$(node -p "require('./package-lock.json').packages[''].version")" = 2.1.1

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify, test, and build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build unpacked Electron application
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Commit the clean release diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-v2.1.1 node_modules dist release coverage website-dist
          rm -f package-lock.local-validation.json
          rm -f .github/workflows/finalize-v2.1.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --name-only origin/master | sort > "$RUNNER_TEMP/actual-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          .github/ISSUE_TEMPLATE/bug.yml
          CHANGELOG.md
          README.md
          package-lock.json
          package.json
          scripts/verify.mjs
          tests/repository/design-system.test.js
          tests/repository/repository.test.js
          website/index.html
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git commit -m 'Prepare version 2.1.1'
          git push origin HEAD:agent/release-2.1.1-ste
