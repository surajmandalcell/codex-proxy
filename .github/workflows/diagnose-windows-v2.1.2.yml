name: Diagnose Windows package for 2.1.2

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/diagnose-windows-v2.1.2.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/release-2.1.2'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Windows package with complete log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\windows-diagnostics" | Out-Null
          & npm.cmd run dist:dir *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-diagnostics\windows-package.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-2.1.2-package-diagnostics
          path: ${{ runner.temp }}/windows-diagnostics/**
          if-no-files-found: error
          retention-days: 3
