name: Apply desktop rework

on:
  push:
    branches:
      - automation/desktop-rework-20260724
    paths:
      - .rework/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/desktop-rework-20260724
          fetch-depth: 0
      - name: Replace repository tree atomically
        shell: bash
        run: |
          set -euo pipefail
          cp -a .rework/root /tmp/subscription-proxy-inator-root
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/subscription-proxy-inator-root/. .
          git fetch --prune origin master
          git reset --mixed origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild as cross-platform multi-provider desktop proxy"
          git push origin HEAD:master
