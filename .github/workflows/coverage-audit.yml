name: Complete source coverage audit

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/coverage-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@10.9.2 --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full source coverage
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mapfile -d '' tests < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='src/**' \
            "${tests[@]}" 2>&1 | tee "$RUNNER_TEMP/coverage-audit.txt"
          status=${PIPESTATUS[0]}
          printf '\nexit_status=%s\n' "$status" >> "$RUNNER_TEMP/coverage-audit.txt"
          exit "$status"
      - name: Publish audit branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan coverage-audit-result
          git rm -rf .
          cp "$RUNNER_TEMP/coverage-audit.txt" coverage-audit.txt
          git add coverage-audit.txt
          git commit -m 'Record complete source coverage audit'
          git push --force origin HEAD:coverage-audit-result
