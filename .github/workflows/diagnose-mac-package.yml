name: Diagnose macOS package

on:
  push:
    branches:
      - agent/finish-hero-icon-motion
    paths:
      - .github/workflows/diagnose-mac-package.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/finish-hero-icon-motion
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: |
          npm install --global npm@10.9.2 --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Capture Electron Builder result
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DEBUG: electron-builder
        run: |
          set +e
          npm run dist:dir > mac-build.log 2>&1
          status=$?
          {
            printf 'exit_status=%s\n' "$status"
            grep -n -B 20 -A 60 -E 'ERR_|Error:|error:|failed|invalid|icon|icns|svg' mac-build.log | tail -n 220 || true
            printf '\n--- tail ---\n'
            tail -n 220 mac-build.log
          } > .mac-build-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mac-build-tail.txt
          git commit -m "Record macOS builder diagnostic"
          git push origin HEAD:agent/finish-hero-icon-motion
