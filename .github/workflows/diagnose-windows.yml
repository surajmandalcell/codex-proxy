name: Diagnose Windows packaging

on:
  push:
    branches:
      - agent/publication-polish
    paths:
      - .github/workflows/diagnose-windows.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/publication-polish
      - name: Capture failing Windows job log tail
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "89772973491"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
            --output "$RUNNER_TEMP/windows-job.log"
          mkdir -p .diagnostics
          tail -n 180 "$RUNNER_TEMP/windows-job.log" > .diagnostics/windows-packaging.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .diagnostics/windows-packaging.log
          git commit -m "Capture Windows packaging failure" || true
          git push origin HEAD:agent/publication-polish
