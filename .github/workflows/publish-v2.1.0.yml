name: Publish version 2.1.0

on:
  push:
    branches: [master]
    paths:
      - .release-v2.1.0/TRIGGER

permissions:
  contents: write

concurrency:
  group: publish-version-2.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out canonical master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Verify release identity and interface
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = 2.1.0
          test "$(node -p "require('./package-lock.json').version")" = 2.1.0
          test "$(node -p "require('./package-lock.json').packages[''].version")" = 2.1.0
          grep -q 'Use every AI subscription through one local gateway' website/index.html
          grep -q 'Claude, Codex, and Z.ai subscriptions connect to Proxy-Inator' website/index.html
          grep -q 'Harness' website/index.html
          grep -q 'Automation' website/index.html
          grep -q 'stroke="#ffffff"' build/icon.svg
          if grep -E '#161616|#d0e2ff' build/icon.svg; then
            echo 'Packaging icon contains non-white glyph colors.' >&2
            exit 1
          fi
          if git rev-parse --verify refs/tags/v2.1.0 >/dev/null 2>&1; then
            echo 'v2.1.0 already exists.' >&2
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify, test, and build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Create clean release commit and tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules dist release coverage website-dist .release-v2.1.0
          rm -f package-lock.local-validation.json
          rm -f .github/workflows/publish-v2.1.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish version 2.1.0"
          git push origin HEAD:master
          git tag -a v2.1.0 -m "Subscription Proxy Inator 2.1.0"
          git push origin v2.1.0
