name: Capture IBM redesign visual audit failure

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/visual-audit-diagnostics.yml

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Download failed visual audit log
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "89804455701"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
            --output visual-audit-full.log
          tail -n 260 visual-audit-full.log > visual-audit-tail.log
          grep -n -B 25 -A 60 -E 'Error:|failed at|overflow|Expected seven|Incomplete site|Fabricated|console errors|Chrome target' visual-audit-full.log > visual-audit-failure.log || true

      - name: Upload visual audit diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ibm-interface-visual-audit-diagnostics
          path: |
            visual-audit-tail.log
            visual-audit-failure.log
          if-no-files-found: error
          retention-days: 2
