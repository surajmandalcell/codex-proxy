name: Capture follow-up failure

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/capture-followup-failure.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Capture failed executor log
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "89814555814"
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > full.log
          {
            grep -n -B 35 -A 90 -E 'not ok|AssertionError|ERR_|Error:|failed|SyntaxError|coverage|Missing|required|does not match|Process completed' full.log || true
            printf '\n--- tail ---\n'
            tail -n 260 full.log
          } > .followup-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .followup-diagnostic.txt
          git commit -m "Record follow-up build failure"
          git push origin HEAD:${{ github.head_ref }}
