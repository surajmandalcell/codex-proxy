    if (event.target.closest('a')) closeMenu();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMenu();
  });

  const wideLayout = window.matchMedia('(min-width: 841px)');
  wideLayout.addEventListener('change', (event) => {
