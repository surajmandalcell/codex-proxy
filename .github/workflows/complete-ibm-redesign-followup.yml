name: Complete IBM redesign follow-up

on:
  push:
    branches:
      - agent/complete-ibm-redesign-followup
    paths:
      - .complete-followup/TRIGGER

permissions:
  contents: write

concurrency:
  group: complete-ibm-redesign-followup
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v6
        with:
          ref: agent/complete-ibm-redesign-followup
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Apply complete review follow-up
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, content):
              (root / path).parent.mkdir(parents=True, exist_ok=True)
              (root / path).write_text(content, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Mutations report success so sensitive fields are not cleared after failures.
          replace_once(
              'desktop/renderer/App.jsx',
              """    try { await operation(); await refresh(); setError(null); }
    catch (cause) { setError(cause.message); }
    finally { setBusy(false); }
""",
              """    try {
      await operation();
      await refresh();
      setError(null);
      return true;
    } catch (cause) {
      setError(cause.message);
      return false;
    } finally {
      setBusy(false);
    }
""",
          )

          # Shared value-aware and dirty-aware draft state for polling screens.
          write('desktop/renderer/hooks/useSyncedDraft.js', """import { useCallback, useEffect, useMemo, useRef, useState } from 'react';

export function useSyncedDraft(source) {
  const sourceRef = useRef(source);
  sourceRef.current = source;
  const sourceKey = useMemo(() => JSON.stringify(source), [source]);
  const [draft, setDraftState] = useState(source);
  const [dirty, setDirty] = useState(false);

  useEffect(() => {
    if (!dirty) setDraftState(sourceRef.current);
  }, [dirty, sourceKey]);

  const setDraft = useCallback((next) => {
    setDirty(true);
    setDraftState(next);
  }, []);

  const markClean = useCallback(() => setDirty(false), []);
  const reset = useCallback(() => {
    setDraftState(sourceRef.current);
    setDirty(false);
  }, [sourceKey]);

  return { draft, setDraft, dirty, markClean, reset };
}
""")

