name: Execute complete IBM redesign follow-up

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/execute-complete-followup.yml

permissions:
  contents: write

concurrency:
  group: complete-ibm-redesign-followup
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Apply follow-up when not already applied
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f desktop/renderer/hooks/useSyncedDraft.js ]]; then
            awk '
              /python3 <<'"'"'PY'"'"'/ { capture=1; next }
              capture && /^          PY$/ { capture=0; exit }
              capture { sub(/^          /, ""); print }
            ' .github/workflows/complete-ibm-redesign-followup.yml > "$RUNNER_TEMP/apply-followup.py"
            test -s "$RUNNER_TEMP/apply-followup.py"
            python3 - "$RUNNER_TEMP/apply-followup.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = """              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
"""
          new = """              if count != 1:
                  if path == 'desktop/renderer/pages/Providers.jsx' and 'setDraft(provider)' in old:
                      return
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
"""
          if old not in text:
              raise SystemExit('replace_once helper was not found in extracted patch script')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
            python3 "$RUNNER_TEMP/apply-followup.py"
            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('desktop/renderer/pages/Providers.jsx')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r"onClick=\{\(\) => \{\s*setDraft\(provider\);\s*setHeadersText\(pretty\(provider\.headers\)\);\s*setAdapterText\(pretty\(provider\.adapter\)\);\s*\}\}",
              'onClick={reset}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'provider discard handler replacement count: {count}')
          path.write_text(text, encoding='utf-8')
          PY
          fi

          if [[ ! -s website/assets/social-card.png ]]; then
            if command -v magick >/dev/null 2>&1; then
              magick website/assets/social-card.svg website/assets/social-card.png
            elif command -v convert >/dev/null 2>&1; then
              convert website/assets/social-card.svg website/assets/social-card.png
            else
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends librsvg2-bin
              rsvg-convert -w 1200 -h 630 website/assets/social-card.svg > website/assets/social-card.png
            fi
          fi
          test -s website/assets/social-card.png

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify, test, and build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build unpacked Linux application
        run: npm run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Commit final follow-up
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/complete-ibm-redesign-followup.yml
          rm -f .github/workflows/execute-complete-followup.yml
          rm -f .github/workflows/capture-followup-failure.yml
          rm -f .followup-diagnostic.txt
          rm -rf .complete-followup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete IBM redesign review follow-up"
          git push origin HEAD:${{ github.head_ref }}
