name: Feature request
description: Propose a focused provider, routing, compatibility, metering, or desktop capability.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or maintainer problem rather than only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options: [Providers, Accounts, Routing, Compatibility API, Usage and pricing, Desktop interface, Security, Documentation, Build and release]
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and alternatives
      description: Note protocol, platform, security, or backward-compatibility constraints.
