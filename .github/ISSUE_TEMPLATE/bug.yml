name: Defect report
description: Report a defect in the desktop app, gateway, routing, or protocol conversion.
title: "[Defect]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include keys, tokens, cookies, prompts, or logs that contain private data.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 2.1.1
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps and observed result
      description: Give the smallest steps. Include the protocol, provider type, and redacted error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Remove credentials, prompts, account IDs, and personal data.
